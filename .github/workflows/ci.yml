name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable corepack (pnpm 10)
        run: corepack enable

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Workspace packages export from dist, so build must run before typecheck/test.
      - name: Build workspace
        run: pnpm -r build

      - name: Typecheck workspace
        run: pnpm -r typecheck

      - name: Test workspace
        run: pnpm -r --workspace-concurrency=1 test
